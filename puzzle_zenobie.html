<title>لغز الملكة زنوبيا</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 22px 14px;
    font-family: Tahoma, Arial, sans-serif; color: #263238;
    background: linear-gradient(135deg, #f3eee5, #e4eee9);
    display: flex; justify-content: center; align-items: center;
  }
  .game {
    width: min(620px, 100%); background: #fffdf9; border-radius: 22px;
    padding: 22px; box-shadow: 0 12px 35px #24352b22; text-align: center;
  }
  h1 { margin: 0 0 8px; color: #694b37; font-size: clamp(22px, 5vw, 30px); }
  .instruction { font-size: 22px; font-weight: bold; margin: 8px 0 16px; color: #315e55; }
  .topbar { display:flex; justify-content:center; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:15px; }
  .timer { background:#fff1dc; border:2px solid #e7bd79; border-radius:12px; padding:9px 18px; font-size:20px; font-weight:bold; min-width:125px; }
  .timer.urgent { color:#b3261e; border-color:#b3261e; }
  button {
    border:0; border-radius:12px; padding:11px 18px; cursor:pointer;
    background:#315e55; color:white; font-size:16px; font-weight:bold;
  }
  button:hover { background:#24483f; }
  #board {
    width:min(100%, 390px); margin:auto; aspect-ratio: 353 / 628;
    display:grid; grid-template-columns:repeat(4, 1fr); grid-template-rows:repeat(4, 1fr);
    gap:3px; padding:4px; background:#6b5140; border-radius:12px;
    overflow:hidden; touch-action: manipulation;
  }

<body>
<main class="game">
  <h1>لغز الملكة زنوبيا</h1>
  <p class="instruction">أعد تركيب الصورة</p>
  <div class="topbar">
    <div class="timer" id="timer" aria-live="polite">الوقت: 01:00</div>
    <button id="restart" type="button">إعادة اللعب</button>
  </div>
  <div id="board" aria-label="لوحة أحجية من ستة عشر مربعاً"></div>
  <p id="message" aria-live="polite">اضغط على مربعين لتبديل مكانيهما.</p>
  <p class="hint">لديك دقيقة واحدة لإعادة ترتيب أجزاء اللوحة.</p>
</main>
<script>
(() => {
  const board = document.getElementById('board');
  const timerEl = document.getElementById('timer');
  const message = document.getElementById('message');
  const restart = document.getElementById('restart');
  const total = 16;
  let order = [], selected = null, seconds = 60, interval = null, finished = false;

  function shuffle() {
    const a = Array.from({length: total}, (_, i) => i);
    // Fisher-Yates, then ensure the puzzle is not already solved.
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    if (a.every((v, i) => v === i)) [a[0], a[1]] = [a[1], a[0]];
    return a;
  }

  function render() {
    board.innerHTML = '';
    order.forEach((piece, position) => {
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'tile' + (selected === position ? ' selected' : '');
      tile.setAttribute('aria-label', 'المربع ' + (position + 1));
      const row = Math.floor(piece / 4), col = piece % 4;
      tile.style.backgroundPosition = `${col * 100 / 3}% ${row * 100 / 3}%`;
      tile.addEventListener('click', () => choose(position));
      board.appendChild(tile);
    });
  }

  function choose(position) {
    if (finished) return;
    if (selected === null) {
      selected = position;
    } else if (selected === position) {
      selected = null;
    } else {
      [order[selected], order[position]] = [order[position], order[selected]];
      selected = null;
      if (order.every((piece, i) => piece === i)) {
        finish(true);
      }
    }
    render();
  }

  function updateTimer() {
    const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
    const ss = String(seconds % 60).padStart(2, '0');
    timerEl.textContent = 'الوقت: ' + mm + ':' + ss;
    timerEl.classList.toggle('urgent', seconds <= 10);
  }

  function finish(won) {
    finished = true;
    clearInterval(interval);
    selected = null;
    message.textContent = won ? 'أحسنت! لقد أعدت تركيب الصورة بنجاح!' : 'انتهى الوقت! حاول مرة أخرى.';
    render();
  }

  function start() {
    clearInterval(interval);
    order = shuffle();
    selected = null;
    seconds = 60;
    finished = false;
    message.textContent = 'اضغط على مربعين لتبديل مكانيهما.';
    updateTimer();
    render();
    interval = setInterval(() => {
      if (finished) return;
      seconds--;
      updateTimer();
      if (seconds <= 0) finish(false);
    }, 1000);
  }
  restart.addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
